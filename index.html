let muted=false, audioCtx=null, masterGain=null, audioDest=null;
function getAC(){
  if(!audioCtx){try{audioCtx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}
  if(audioCtx&&audioCtx.state==='suspended') audioCtx.resume();
  if(audioCtx&&!masterGain){
    masterGain=audioCtx.createGain(); masterGain.gain.value=1;
    masterGain.connect(audioCtx.destination);
    audioDest=audioCtx.createMediaStreamDestination();
    masterGain.connect(audioDest);
  }
  return audioCtx;
}
function audioOut(){ getAC(); return masterGain || (audioCtx&&audioCtx.destination); }

function tone(freq,dur,type='sine',vol=.25,delay=0){
  if(muted)return;
  try{const ac=getAC();if(!ac)return;
    const o=ac.createOscillator(),g=ac.createGain();
    o.connect(g);g.connect(audioOut());
    o.type=type; o.frequency.setValueAtTime(freq,ac.currentTime+delay);
    g.gain.setValueAtTime(vol,ac.currentTime+delay);
    g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+delay+dur);
    o.start(ac.currentTime+delay);o.stop(ac.currentTime+delay+dur+.01);
  }catch(e){}
}

/* ════════════════════════════════════════
   LEVEL CONFIG

function lvlCfg(l){
  return{
    spawnSec    : Math.max(.45, 1.0 - (l-1)*.07),
    speedMult   : 1.1 + (l-1)*.18,
    impostorRate: l>=2 ? Math.min(.18, .04 + l*.02) : 0,
    powerupRate : l>=2 ? .07 : 0,
    nextAt      : 8 + l * 4,
  };
}

/* ════════════════════════════════════════
   COLOR HELPERS
   ════════════════════════════════════════ */
function lighten(hex,amt){
  const m=hex.match(/^#([0-9a-f]{6})$/i); if(!m)return hex;
  const n=parseInt(m[1],16);
  const r=Math.min(255,((n>>16)&255)+255*amt);
  const g=Math.min(255,((n>>8)&255)+255*amt);
  const b=Math.min(255,(n&255)+255*amt);
  return `rgb(${r|0},${g|0},${b|0})`;
}
function darken(hex,amt){
  const m=hex.match(/^#([0-9a-f]{6})$/i); if(!m)return hex;
  const n=parseInt(m[1],16);
  const r=Math.max(0,((n>>16)&255)-255*amt);
  const g=Math.max(0,((n>>8)&255)-255*amt);
  const b=Math.max(0,(n&255)-255*amt);
  return `rgb(${r|0},${g|0},${b|0})`;
}
function brandHex(brand){ return brand==='zomato' ? BRAND.zomato : BRAND.blinkit; }

/* ════════════════════════════════════════
   AMBIENT BACKGROUND ORBS  (drifting)
   ════════════════════════════════════════ */
class BgOrb{
  constructor(){
    this.x=Math.random()*W;
    this.y=Math.random()*H;
    this.r=40+Math.random()*70;
    this.vx=(Math.random()-.5)*.2;
    this.vy=-.1-Math.random()*.15;
    this.col=Math.random()<.5?BRAND.zomato:BRAND.blinkit;
    this.alpha=0.04+Math.random()*0.04;
    this.phase=Math.random()*Math.PI*2;
  }
  update(dt){
    this.x+=this.vx; this.y+=this.vy;
    this.phase+=dt*.8;
    if(this.y<-this.r) { this.y=H+this.r; this.x=Math.random()*W; }
  }
  draw(){
    const a=this.alpha*(0.8+0.4*Math.sin(this.phase));
    const g=ctx.createRadialGradient(this.x,this.y,0, this.x,this.y,this.r);
    g.addColorStop(0, this.col + Math.floor(a*255).toString(16).padStart(2,'0'));
    g.addColorStop(1, this.col + '00');
    ctx.fillStyle=g;
    ctx.beginPath(); ctx.arc(this.x,this.y,this.r,0,Math.PI*2); ctx.fill();
  }
}
function initBgOrbs(){}

/* ════════════════════════════════════════
   AMBIENT DELIVERY BIKE
   ════════════════════════════════════════ */
class Bike{
  constructor(){
    this.y=H-100+Math.random()*40;
    this.x=-60;
    this.vx=12;
    this.life=1;
    this.trail=[];
  }
  update(dt){
    this.x+=this.vx;
    this.trail.push({x:this.x-30,y:this.y+10,life:1});
    if(this.trail.length>15) this.trail.shift();
    for(const t of this.trail) t.life-=.04;
    if(this.x>W+80) this.life=0;
  }
  draw(){
    /* trail */
    for(const t of this.trail){
      if(t.life>0){
        ctx.save(); ctx.globalAlpha=t.life*.4;
        ctx.fillStyle=BRAND.zomato;
        ctx.beginPath(); ctx.arc(t.x,t.y,4,0,Math.PI*2); ctx.fill();
        ctx.restore();
      }
    }
    /* bike */
    ctx.save();
    ctx.font='40px Arial'; ctx.textBaseline='middle';
    ctx.fillText('🛵',this.x,this.y);
    ctx.restore();
  }
}

/* ════════════════════════════════════════
   ITEM  (the core graphic)
   ════════════════════════════════════════ */
class Item{
  constructor(opts={}){
    const cfg=lvlCfg(level);
    if(opts.type){ this.type=opts.type; this.spec=opts.spec; }
    else {
      const r=Math.random();
      if(r<cfg.impostorRate){
        this.type='imposter';
        this.spec=BRAND.imposters[Math.floor(Math.random()*BRAND.imposters.length)];
      } else if(r<cfg.impostorRate+cfg.powerupRate){
        this.type='powerup';
        this.spec=BRAND.powerups[Math.floor(Math.random()*BRAND.powerups.length)];
      } else {
        this.type='product';
        this.spec=pickWeighted();
      }
    }

    this.r = opts.r || (this.type==='product' ? (38+Math.random()*8) : 38);
    /* spawn bias: zomato → left, blinkit → right (visual storytelling) */
    let xRange;
    if(this.type==='product'){
      if(this.spec.brand==='zomato') xRange=[SAFE.x+10, SAFE.x+SAFE.w*0.55];
      else                            xRange=[SAFE.x+SAFE.w*0.45, SAFE.x+SAFE.w-10];
    } else { xRange=[this.r, W-this.r]; }
    this.x = (opts.x!==undefined) ? opts.x : (xRange[0] + Math.random()*(xRange[1]-xRange[0]));
    this.y = (opts.y!==undefined) ? opts.y : (-this.r-10);
    this.vy = (1.5+Math.random()*1.2)*lvlCfg(level).speedMult;
    this.vx = (Math.random()-.5)*1.2;
    this.rot=(Math.random()-.5)*.4;
    this.rotV=(Math.random()-.5)*.04;
    this.alive=true; this.caught=false; this.catchT=0;
    this.spawnT=0;
    this.frozen=false;
    this.nearPlayer=false;

    /* spring-in scale */
    this.scaleT=0;
  }

  update(dt){
    this.scaleT=Math.min(1,this.scaleT+dt*5);
    if(this.caught){ this.catchT+=dt*4; if(this.catchT>1) this.alive=false; return; }
    this.frozen = freezeActive && this.type!=='imposter';
    if(!this.frozen){
      this.x += this.vx; this.y += this.vy; this.rot += this.rotV;
      if(this.x<this.r){this.x=this.r;this.vx*=-.5;}
      if(this.x>W-this.r){this.x=W-this.r;this.vx*=-.5;}
    }
    if(this.y > H+this.r*3) this.alive=false;

    this.nearPlayer=false;
    for(const p of handPts) if(Math.hypot(p.x-this.x,p.y-this.y)<this.r*2.6){this.nearPlayer=true;break;}
    this.spawnT+=dt;
  }

  /* the brand color for this item */
  brandCol(){
    if(this.type==='product') return brandHex(this.spec.brand);
    if(this.type==='imposter') return this.spec.color;
    return this.spec.color;
  }

  draw(){
    const baseScale = 1 - (1-this.scaleT)*(1-this.scaleT);  /* ease-out spring */

    if(this.caught){
      const k=this.catchT;
      const ease = 1 - (1-k)*(1-k);
      const s = (1 + ease*0.4) * (1 - ease*1.0);
      ctx.save();
      ctx.globalAlpha=Math.max(0,1-k);
      ctx.translate(this.x,this.y);
      ctx.scale(s,s); ctx.rotate(this.rot);
      this._body(); ctx.restore();
      return;
    }

    /* near-hand magnetic ring (animated) */
    if(this.nearPlayer&&!this.frozen){
      const pulse = 1 + 0.08*Math.sin(pulseT*8);
      ctx.save();
      ctx.beginPath();
      ctx.arc(this.x,this.y,this.r*1.5*pulse,0,Math.PI*2);
      ctx.strokeStyle=this.brandCol();
      ctx.lineWidth=3;
      ctx.shadowColor=this.brandCol();
      ctx.shadowBlur=18;
      ctx.stroke();
      ctx.restore();
    }

    /* freeze frost overlay */
    if(this.frozen){
      ctx.save();
      ctx.beginPath(); ctx.arc(this.x,this.y,this.r+6,0,Math.PI*2);
      ctx.strokeStyle='rgba(116,238,255,.6)'; ctx.lineWidth=2;
      ctx.shadowColor='#74eeff'; ctx.shadowBlur=10;
      ctx.stroke();
      ctx.restore();
    }

    ctx.save();
    ctx.translate(this.x,this.y);
    ctx.scale(baseScale, baseScale);
    ctx.rotate(this.rot);
    this._body();
    ctx.restore();

    /* product name briefly when first appears */
    if(this.type==='product' && this.spawnT<.7){
      const a=1-this.spawnT/.7;
      ctx.save();
      ctx.font='bold 11px Arial';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillStyle=`rgba(255,255,255,${a*.85})`;
      ctx.strokeStyle=`rgba(0,0,0,${a*.6})`; ctx.lineWidth=3;
      ctx.strokeText(this.spec.name, this.x, this.y+this.r+14);
      ctx.fillText  (this.spec.name, this.x, this.y+this.r+14);
      ctx.restore();
    }
  }

  _body(){
    const r=this.r;
    const col = this.brandCol();
    const isImp  = this.type==='imposter';

    /* simple solid disc with brand color */
    ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2);
    ctx.fillStyle = col;
    ctx.shadowColor = isImp ? '#000' : col;
    ctx.shadowBlur = 14;
    ctx.fill();
    ctx.shadowBlur = 0;

    /* thin ring */
    ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2);
    ctx.strokeStyle = isImp ? '#fff' : 'rgba(255,255,255,.7)';
    ctx.lineWidth = 2;
    ctx.stroke();

    /* emoji */
    ctx.font=`${r*1.1}px Arial`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(this.spec.emoji, 0, 2);
  }

  hit(pts){
    if(this.caught||this.frozen) return false;
    for(const p of pts) if(Math.hypot(p.x-this.x,p.y-this.y)<this.r*1.5) return true;
    return false;
  }
}

/* ─── helpers ─── */
function pickWeighted(){
  const eligible = BRAND.products.filter(p=>!p.minLevel || level>=p.minLevel);
  const tot = eligible.reduce((s,p)=>s+p.weight,0);
  let r=Math.random()*tot;
  for(const p of eligible){ if((r-=p.weight)<=0) return p; }
  return eligible[0];
}

/* ════════════════════════════════════════
   PARTICLES / FLOAT TEXT / CONFETTI / RAYS
   ════════════════════════════════════════ */
class Particle{
  constructor(x,y,col,big=false){
    this.x=x;this.y=y;
    this.vx=(Math.random()-.5)*(big?12:9);
    this.vy=(Math.random()-.5)*(big?12:9)-3;
    this.r=(big?4:3)+Math.random()*5;this.col=col;this.life=1;this.dec=.018;
  }
  update(){this.x+=this.vx;this.y+=this.vy;this.vy+=.25;this.life-=this.dec;}
  draw(){ctx.save();ctx.globalAlpha=Math.max(0,this.life);
    ctx.shadowColor=this.col; ctx.shadowBlur=8;
    ctx.fillStyle=this.col;ctx.beginPath();ctx.arc(this.x,this.y,this.r,0,Math.PI*2);ctx.fill();ctx.restore();}
}
class Confetti{
  constructor(x,y,col){
    this.x=x;this.y=y;
    this.vx=(Math.random()-.5)*10;this.vy=-6-Math.random()*6;
    this.w=6+Math.random()*6;this.h=4+Math.random()*4;
    this.rot=Math.random()*Math.PI;this.rotV=(Math.random()-.5)*.15;
    this.col=col || (Math.random()<.5?BRAND.zomato:BRAND.blinkit);
    this.life=1;this.dec=.011;
  }
  update(){this.x+=this.vx;this.y+=this.vy;this.vy+=.3;this.rot+=this.rotV;this.life-=this.dec;}
  draw(){ctx.save();ctx.globalAlpha=Math.max(0,this.life);
    ctx.translate(this.x,this.y);ctx.rotate(this.rot);
    ctx.fillStyle=this.col;ctx.fillRect(-this.w/2,-this.h/2,this.w,this.h);ctx.restore();}
}
class FloatText{
  constructor(x,y,text,col,big=false){this.x=x;this.y=y;this.text=text;this.col=col;
    this.life=1;this.vy=big?-3:-1.8;this.size=big?42:26;}
  update(){this.y+=this.vy;this.life-=.022;}
  draw(){ctx.save();ctx.globalAlpha=Math.max(0,this.life);
    ctx.font=`bold ${this.size}px Arial`;ctx.textAlign='center';ctx.textBaseline='middle';
    /* triple-stroke for depth */
    ctx.strokeStyle='rgba(0,0,0,.7)';ctx.lineWidth=6;
    ctx.strokeText(this.text,this.x,this.y);
    ctx.shadowColor=this.col; ctx.shadowBlur=12;
    ctx.fillStyle=this.col;ctx.fillText(this.text,this.x,this.y);ctx.restore();}
}
class CartFlyer{
  constructor(item, targetX, targetY){
    this.x=item.x; this.y=item.y; this.r=item.r*.55;
    this.spec=item.spec; this.brand=item.spec.brand;
    this.tx=targetX; this.ty=targetY;
    this.t=0; this.dur=.55;
  }
  update(dt){ this.t += dt; }
  draw(){
    const k=Math.min(1,this.t/this.dur);
    const ease = 1-(1-k)*(1-k);
    const x = this.x + (this.tx-this.x)*ease;
    const y = this.y + (this.ty-this.y)*ease - Math.sin(k*Math.PI)*40;  /* arc */
    const s = 1 - k*0.5;
    ctx.save();
    ctx.globalAlpha=1-k*.4;
    ctx.translate(x,y); ctx.scale(s,s);
    ctx.shadowColor=brandHex(this.brand); ctx.shadowBlur=12;
    ctx.beginPath(); ctx.arc(0,0,this.r,0,Math.PI*2);
    ctx.fillStyle=brandHex(this.brand); ctx.fill();
    ctx.font=`${this.r*1.1}px Arial`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.shadowBlur=0;
    ctx.fillText(this.spec.emoji,0,2);
    ctx.restore();
  }
  done(){ return this.t>=this.dur; }
}
class LightRay{
  constructor(cx,cy){
    this.cx=cx; this.cy=cy;
    this.angle=Math.random()*Math.PI*2;
    this.len=H*.5 + Math.random()*H*.3;
    this.life=1; this.dec=.025;
    this.col = Math.random()<.5?BRAND.zomato:BRAND.blinkit;
    this.width=8+Math.random()*8;
  }
  update(){this.life-=this.dec;}
  draw(){
    if(this.life<=0)return;
    ctx.save();
    ctx.translate(this.cx,this.cy);
    ctx.rotate(this.angle);
    const g=ctx.createLinearGradient(0,0,this.len,0);
    g.addColorStop(0, this.col + Math.floor(this.life*180).toString(16).padStart(2,'0'));
    g.addColorStop(1, this.col + '00');
    ctx.fillStyle=g;
    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.lineTo(this.len,-this.width/2);
    ctx.lineTo(this.len,this.width/2);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }
}

function burstConfetti(x,y,n=80,col){
  for(let i=0;i<n;i++) confetti.push(new Confetti(x,y,col));
}
function burstRays(cx,cy,n=14){
  for(let i=0;i<n;i++) lightRays.push(new LightRay(cx,cy));
}

/* ════════════════════════════════════════
   CATCH LOGIC
   ════════════════════════════════════════ */
function catchItem(it){
  it.caught=true;
  const col = it.brandCol();

  /* particles (more for premium items) */
  const pCount = it.type==='product' && it.spec.pts>=3 ? 32 : 20;
  for(let i=0;i<pCount;i++)
    particles.push(new Particle(it.x,it.y, i%3===0?'#fff':col));

  if(it.type==='imposter'){
    lives=Math.max(0,lives-1); combo=0; comboFrames=0; crossStreak=0; lastBrand=null;
    floatTexts.push(new FloatText(it.x,it.y-20, `${it.spec.emoji} ${it.spec.name.toUpperCase()}`,'#ff4757',true));
    shakeFrames=18; shakeAmp=12; playImposter();
    if(timerMode==='endless' && lives<=0) endGame();
    return;
  }

  if(it.type==='powerup'){
    const eff=it.spec.effect;
    if(eff==='double'){ doubleActive=true; doubleTimer=it.spec.duration;
      floatTexts.push(new FloatText(it.x,it.y-20,'⚡ INSTANT 2×','#fbbf24',true)); }
    else if(eff==='freeze'){ freezeActive=true; freezeTimer=it.spec.duration;
      floatTexts.push(new FloatText(it.x,it.y-20,'🚀 ROCKET MODE!','#74eeff',true)); }
    else if(eff==='instant5'){ score+=5; levelScore+=5;
      floatTexts.push(new FloatText(it.x,it.y-20,'🆓 FREE +5','#10b981',true)); }
    cartFlyers.push(new CartFlyer(it, SAFE.x+SAFE.w/2, SAFE.y+90));
    playPower(); return;
  }

  /* ─── product caught ─── */
  const p=it.spec;
  totalCatches++;

  /* cross-brand combo: alternating zomato/blinkit */
  let crossBonus=0;
  if(lastBrand && lastBrand!==p.brand){
    crossStreak++;
    if(crossStreak>=2){
      crossBonus=10;
      crossStreak=0;
      floatTexts.push(new FloatText(W/2, SAFE.y+SAFE.h*.45, `🍕↔🛒 ECOSYSTEM +${crossBonus}`, BRAND.accent, true));
      burstConfetti(W/2, SAFE.y+SAFE.h*.5, 50);
      burstRays(W/2, SAFE.y+SAFE.h*.5, 8);
      playEcosystem();
    }
  } else { crossStreak=0; }
  lastBrand=p.brand;

  /* combo */
  combo++; comboFrames=150;
  const mult=(combo>=2?combo:1)*(doubleActive?2:1);
  const pts=p.pts*mult + crossBonus;
  score+=pts; levelScore+=pts;

  /* track in cart */
  cart[p.brand][p.name]=(cart[p.brand][p.name]||0)+1;

  /* fly to cart corner */
  const cartX = p.brand==='zomato' ? SAFE.x+30 : SAFE.x+SAFE.w-30;
  cartFlyers.push(new CartFlyer(it, cartX, SAFE.y+90));

  const label = combo>=2 ? `×${combo} +${pts}` : `+${pts}`;
  const big   = combo>=4 || pts>=10 || p.pts>=4;
  floatTexts.push(new FloatText(it.x,it.y-20,label,col,big));

  /* "DELIVERED!" stamp every 10 catches */
  if(totalCatches%10===0){
    stampT=1;
    score+=10;
    floatTexts.push(new FloatText(W/2, SAFE.y+SAFE.h*.6, `📦 DELIVERED! +10`, '#10b981', true));
    burstConfetti(W/2, SAFE.y+SAFE.h*.6, 60);
    playDelivered();
  }

  playCatch(p.pts, p.brand);
  checkLevelUp();
}

function checkLevelUp(){
  if(levelScore>=lvlCfg(level).nextAt){
    level++; levelScore=0; flashAlpha=.65;
    /* triple confetti + light rays */
    burstConfetti(W*.25, SAFE.y+200, 100);
    burstConfetti(W*.75, SAFE.y+200, 100);
    burstConfetti(W/2,    SAFE.y+260, 60);
    burstRays(W/2, SAFE.y+SAFE.h*.4, 16);

    const tw=TWISTS[level];
    if(tw){
      floatTexts.push(new FloatText(W/2,SAFE.y+150,`${tw[0]} LV ${level}`,BRAND.accent,true));
      floatTexts.push(new FloatText(W/2,SAFE.y+205,tw[1],'#fff',true));
      shakeFrames=22; shakeAmp=9;
    } else {
      floatTexts.push(new FloatText(W/2,SAFE.y+170,`🚀 LEVEL ${level}!`,BRAND.accent,true));
      shakeFrames=10; shakeAmp=4;
    }
    playLevelUp();
  }
}

const END_RECORD_MS = 5000;
function endGame(){
  if(gameState==='gameover') return;
  gameState='gameover';
  if(score>hiScore){hiScore=score; localStorage.setItem('crave_hi',hiScore);}
  ping('completes');
  if(isRecording) setTimeout(()=>{ if(isRecording && (gameState==='gameover'||gameState==='stopped')) stopRecording(); }, END_RECORD_MS);
}
function stopGame(){
  if(gameState==='stopped') return;
  gameState='stopped';
  if(score>hiScore){hiScore=score; localStorage.setItem('crave_hi',hiScore);}
  if(isRecording) setTimeout(()=>{ if(isRecording && (gameState==='gameover'||gameState==='stopped')) stopRecording(); }, END_RECORD_MS);
}

/* ════════════════════════════════════════
   BACKGROUND  (camera + brand atmosphere)
   ════════════════════════════════════════ */
function drawBackground(dt){
  /* mirrored webcam */
  ctx.save(); ctx.translate(W,0); ctx.scale(-1,1);
  if(video.readyState>=2){
    const vw=video.videoWidth||640,vh=video.videoHeight||480;
    const vAR=vw/vh, cAR=W/H;
    let sx,sy,sw,sh;
    if(vAR>cAR){sh=vh;sw=vh*cAR;sx=(vw-sw)/2;sy=0;}
    else       {sw=vw;sh=vw/cAR;sx=0;sy=(vh-sh)/2;}
    cropParams={sx,sy,sw,sh};
    ctx.drawImage(video,sx,sy,sw,sh,0,0,W,H);
  } else { ctx.fillStyle='#111'; ctx.fillRect(0,0,W,H); cropParams=null; }
  ctx.restore();

  /* light dim — keep face visible */
  ctx.fillStyle='rgba(0,0,0,.35)'; ctx.fillRect(0,0,W,H);
}

/* ════════════════════════════════════════
   HAND TRACKING
   ════════════════════════════════════════ */
let mpHands=null, frameSending=false;
try{
  mpHands=new Hands({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/${f}`});
  mpHands.setOptions({maxNumHands:2,modelComplexity:1,minDetectionConfidence:.5,minTrackingConfidence:.4});
  mpHands.onResults(r=>{
    handPts=[]; handsCount=0;
    if(!r.multiHandLandmarks)return;
    handsCount=r.multiHandLandmarks.length;
    for(const lms of r.multiHandLandmarks){
      for(const idx of [0,4,8,12,16,20]){
        const lm=lms[idx]; let cx,cy;
        if(cropParams){
          const vw=video.videoWidth||640,vh=video.videoHeight||480;
          const vx=lm.x*vw,vy=lm.y*vh;
          cx=(1-(vx-cropParams.sx)/cropParams.sw)*W;
          cy=(vy-cropParams.sy)/cropParams.sh*H;
        } else {cx=(1-lm.x)*W;cy=lm.y*H;}
        if(cx>=0&&cx<=W&&cy>=0&&cy<=H) handPts.push({x:cx,y:cy});
      }
    }
  });
}catch(e){console.warn('MediaPipe',e);}
async function sendFrame(){
  if(mpHands&&video.readyState>=2&&!frameSending){
    frameSending=true;
    try{await mpHands.send({image:video});}catch(_){}
    frameSending=false;
  }
  requestAnimationFrame(sendFrame);
}

let currentCamId=null;
async function startCameraStream(deviceId){
  try{
    if(video.srcObject) video.srcObject.getTracks().forEach(t=>t.stop());
    const constraints={
      video: deviceId
        ? {deviceId:{exact:deviceId}, width:{ideal:1920}, height:{ideal:1080}}
        : {facingMode:'user', width:{ideal:1920}, height:{ideal:1080}},
      audio:false
    };
    const s=await navigator.mediaDevices.getUserMedia(constraints);
    video.srcObject=s; await video.play();
    currentCamId=deviceId||s.getVideoTracks()[0].getSettings().deviceId;
    cameraOK=true;
    if(gameState==='loading') gameState='ready';
    statusEl.textContent='✅ Camera ready';
    return true;
  }catch(e){ statusEl.textContent='⚠️ '+e.message; return false; }
}
async function listCameras(){
  try{
    const devs=await navigator.mediaDevices.enumerateDevices();
    const cams=devs.filter(d=>d.kind==='videoinput');
    camSelect.innerHTML='';
    cams.forEach((c,i)=>{
      const opt=document.createElement('option');
      opt.value=c.deviceId;
      let lbl=c.label||`Camera ${i+1}`;
      if(/iphone/i.test(lbl)) lbl='📱 '+lbl;
      else if(/facetime|builtin|integrated/i.test(lbl)) lbl='💻 '+lbl;
      opt.textContent=lbl;
      if(c.deviceId===currentCamId) opt.selected=true;
      camSelect.appendChild(opt);
    });
    if(cams.length===0) camSelect.innerHTML='<option>No cameras found</option>';
  }catch(e){console.warn(e);}
}
async function setupCamera(){
  if(await startCameraStream()){ await listCameras(); sendFrame(); }
}
camSelect.addEventListener('change',()=>startCameraStream(camSelect.value));
navigator.mediaDevices.addEventListener?.('devicechange',listCameras);

/* ════════════════════════════════════════
   HAND CURSOR  —  premium magnetic glow
   ════════════════════════════════════════ */
function drawHands(){
  for(const p of handPts){
    /* find closest item to dynamically tint */
    let nearest=null, nd=Infinity;
    for(const it of items){
      if(it.caught) continue;
      const d=Math.hypot(p.x-it.x, p.y-it.y);
      if(d<nd){nd=d;nearest=it;}
    }
    const tintCol = nearest && nd<150 ? nearest.brandCol() : '#ffffff';
    const intensity = nearest && nd<150 ? Math.max(.3, 1 - nd/150) : .4;

    ctx.save();
    /* outer halo (magnetic) */
    const haloR = 30 + intensity*15;
    const halo = ctx.createRadialGradient(p.x,p.y,5, p.x,p.y,haloR);
    halo.addColorStop(0, tintCol + Math.floor(intensity*80).toString(16).padStart(2,'0'));
    halo.addColorStop(1, tintCol + '00');
    ctx.fillStyle=halo;
    ctx.beginPath(); ctx.arc(p.x,p.y,haloR,0,Math.PI*2); ctx.fill();

    /* ring (color picks up nearest item brand) */
    ctx.beginPath(); ctx.arc(p.x,p.y, 18 + intensity*3, 0, Math.PI*2);
    ctx.strokeStyle = tintCol;
    ctx.lineWidth = 2.5 + intensity*1.5;
    ctx.shadowColor = tintCol; ctx.shadowBlur = 8;
    ctx.stroke();

    /* center dot */
    ctx.beginPath(); ctx.arc(p.x,p.y,5,0,Math.PI*2);
    ctx.fillStyle='#fff';
    ctx.shadowBlur=0;
    ctx.fill();
    ctx.restore();
  }
}

/* ════════════════════════════════════════
   HUD  (premium glass design)
   ════════════════════════════════════════ */
function drawHUD(){
  const hudY = SAFE.y + 12;

  /* SCORE (top-left, big and clean) */
  ctx.save();
  ctx.font='900 44px -apple-system,Arial';
  ctx.textAlign='left'; ctx.textBaseline='top';
  ctx.shadowColor='rgba(0,0,0,.85)'; ctx.shadowBlur=8;
  ctx.fillStyle='#fff';
  ctx.fillText(String(score), SAFE.x+5, hudY);
  ctx.restore();

  /* LEVEL (small, under score) */
  ctx.save();
  ctx.font='bold 12px Arial'; ctx.textAlign='left'; ctx.textBaseline='top';
  ctx.fillStyle=BRAND.accent;
  ctx.shadowColor='rgba(0,0,0,.7)'; ctx.shadowBlur=4;
  ctx.fillText(`LV ${level}`, SAFE.x+5, hudY+50);
  ctx.restore();

  /* TIMER / LIVES (top-right) */
  ctx.save();
  ctx.textAlign='right'; ctx.textBaseline='top';
  if(timerMode==='endless'){
    ctx.font='22px Arial';
    ctx.fillText('❤️'.repeat(lives)+'🖤'.repeat(Math.max(0,3-lives)), SAFE.x+SAFE.w-5, hudY+8);
  } else {
    const col=timerLeft<=10?BRAND.zomato:timerLeft<=20?'#ffa502':BRAND.blinkit;
    ctx.font='900 36px Arial'; ctx.fillStyle=col;
    ctx.shadowColor='rgba(0,0,0,.85)'; ctx.shadowBlur=8;
    ctx.fillText(`${Math.ceil(timerLeft)}s`, SAFE.x+SAFE.w-5, hudY);
  }
  ctx.restore();

  /* ── COMBO (centered, only when active) ── */
  if(combo>=2&&comboFrames>0){
    const a=Math.min(1,comboFrames/150);
    const pulse=1+0.06*Math.sin(pulseT*8);
    const sz=22+Math.min(combo,6)*1.4;
    ctx.save();
    ctx.font=`900 ${sz*pulse}px -apple-system,Arial`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.shadowColor='rgba(0,0,0,.8)'; ctx.shadowBlur=6;
    ctx.fillStyle=`rgba(255,235,59,${a})`;
    ctx.fillText(`×${combo}`, W/2, hudY+85);
    ctx.restore();
  }

  /* ── POWER-UP STATUS (compact, only when active) ── */
  let pwY=hudY+120;
  if(doubleActive){ drawStatusPill(W/2, pwY, `⚡ 2× ${Math.ceil(doubleTimer)}s`, '#fbbf24'); pwY+=24; }
  if(freezeActive){ drawStatusPill(W/2, pwY, `🚀 ${Math.ceil(freezeTimer)}s`, '#74eeff'); }

  /* ── BOTTOM BAR — single line hashtag, minimal ── */
  ctx.save();
  ctx.font='bold 13px Arial'; ctx.textAlign='center'; ctx.textBaseline='bottom';
  ctx.fillStyle=BRAND.accent;
  ctx.shadowColor='rgba(0,0,0,.85)'; ctx.shadowBlur=6;
  ctx.fillText(BRAND.hashtag, W/2, SAFE.y+SAFE.h-8);
  ctx.restore();

  /* REC dot */
  if(isRecording){
    ctx.save();
    ctx.beginPath(); ctx.arc(SAFE.x+SAFE.w-15, hudY+10, 7, 0, Math.PI*2);
    ctx.fillStyle=`rgba(244,63,94,${.7+.3*Math.sin(Date.now()/250)})`;
    ctx.shadowColor='#f43f5e'; ctx.shadowBlur=12; ctx.fill();
    ctx.restore();
  }
}

function drawCartPill(x,y,w,h,col,emoji,count){
  ctx.save();
  /* glassy pill */
  ctx.beginPath();
  if(ctx.roundRect) ctx.roundRect(x,y,w,h,18); else ctx.rect(x,y,w,h);
  const g=ctx.createLinearGradient(x,y,x,y+h);
  g.addColorStop(0, col + 'dd');
  g.addColorStop(1, darken(col,.3));
  ctx.fillStyle=g;
  ctx.shadowColor=col; ctx.shadowBlur=10;
  ctx.fill();
  ctx.shadowBlur=0;
  ctx.strokeStyle=lighten(col,.2); ctx.lineWidth=1; ctx.stroke();

  /* shine */
  ctx.beginPath();
  if(ctx.roundRect) ctx.roundRect(x+2,y+2,w-4,h*.4,16); else ctx.rect(x+2,y+2,w-4,h*.4);
  ctx.fillStyle='rgba(255,255,255,.18)'; ctx.fill();

  /* emoji */
  ctx.font='20px Arial'; ctx.textAlign='left'; ctx.textBaseline='middle';
  ctx.fillText(emoji, x+8, y+h/2);

  /* count */
  ctx.font='900 16px Arial'; ctx.textAlign='right';
  ctx.fillStyle='#fff';
  ctx.shadowColor='rgba(0,0,0,.5)'; ctx.shadowBlur=3;
  ctx.fillText(`×${count}`, x+w-10, y+h/2);
  ctx.restore();
}

function drawStatusPill(cx, y, text, col){
  ctx.save();
  ctx.font='bold 13px Arial'; ctx.textAlign='center'; ctx.textBaseline='middle';
  const w=ctx.measureText(text).width+24;
  const x=cx-w/2;
  ctx.beginPath();
  if(ctx.roundRect) ctx.roundRect(x,y-11,w,22,11); else ctx.rect(x,y-11,w,22);
  ctx.fillStyle='rgba(0,0,0,.55)'; ctx.fill();
  ctx.strokeStyle=col; ctx.lineWidth=1.5; ctx.stroke();
  ctx.fillStyle=col; ctx.shadowColor=col; ctx.shadowBlur=6;
  ctx.fillText(text, cx, y);
  ctx.restore();
}

function card(x,y,w,h, opacity=.65){
  ctx.save();
  ctx.beginPath();
  if(ctx.roundRect) ctx.roundRect(x,y,w,h,24); else ctx.rect(x,y,w,h);
  ctx.fillStyle=`rgba(0,0,10,${opacity})`; ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.1)'; ctx.lineWidth=1.5; ctx.stroke();
  ctx.restore();
}

/* ════════════════════════════════════════
   COUNTDOWN, READY, END SCREENS
   ════════════════════════════════════════ */
function drawCountdown(){
  const cx = SAFE.x + SAFE.w/2;
  const big = cdNum===0;
  ctx.save();
  ctx.font=`900 ${big?100:160}px -apple-system,Arial`;
  ctx.textAlign='center'; ctx.textBaseline='middle';

  /* glow */
  const txt = big?'CRAVE!':String(cdNum);
  ctx.shadowColor = big ? BRAND.accent : '#fff';
  ctx.shadowBlur = 30;
  ctx.fillStyle = big ? BRAND.accent : '#fff';
  ctx.fillText(txt, cx, SAFE.y+SAFE.h/2);

  /* outline */
  ctx.shadowBlur=0;
  ctx.strokeStyle='rgba(0,0,0,.6)'; ctx.lineWidth=8;
  ctx.strokeText(txt, cx, SAFE.y+SAFE.h/2);
  ctx.fillText(txt, cx, SAFE.y+SAFE.h/2);
  ctx.restore();
}

function drawReady(){
  ctx.fillStyle='rgba(0,0,10,.55)'; ctx.fillRect(0,0,W,H);
  const cardX=SAFE.x+5, cardY=SAFE.y+30, cardW=SAFE.w-10, cardH=SAFE.h-60;
  const cx=cardX+cardW/2;
  card(cardX, cardY, cardW, cardH);
  ctx.save(); ctx.textAlign='center'; ctx.textBaseline='middle';

  /* CRAVE wordmark big */
  ctx.font='900 72px -apple-system,Arial';
  const wm=ctx.createLinearGradient(cx-100,0,cx+100,0);
  wm.addColorStop(0,BRAND.zomato); wm.addColorStop(1,BRAND.blinkit);
  ctx.fillStyle=wm;
  ctx.shadowColor=BRAND.zomato; ctx.shadowBlur=20;
  ctx.fillText('CRAVE', cx, SAFE.y+115);
  ctx.shadowBlur=0;

  ctx.font='bold 12px Arial'; ctx.fillStyle='rgba(255,255,255,.6)';
  ctx.fillText('ZOMATO × BLINKIT', cx, SAFE.y+160);

  ctx.font='bold 18px Arial'; ctx.fillStyle='#fff';
  ctx.fillText('India\'s craving in 10 mins.', cx, SAFE.y+195);

  /* product showcase: Zomato row + Blinkit row */
  const zRow = BRAND.products.filter(p=>p.brand==='zomato').slice(0,5);
  const bRow = BRAND.products.filter(p=>p.brand==='blinkit').slice(0,5);

  const drawPreviewRow=(prods, py, label, col)=>{
    ctx.font='bold 10px Arial'; ctx.fillStyle=col;
    ctx.textAlign='left';
    ctx.fillText(label, cardX+25, py-25);
    const startX = cx - (prods.length-1)*26;
    prods.forEach((p,i)=>{
      const px=startX+i*52;
      ctx.beginPath(); ctx.arc(px, py, 18, 0, Math.PI*2);
      const g=ctx.createRadialGradient(px-5,py-5,2,px,py,18);
      g.addColorStop(0, lighten(col,.5));
      g.addColorStop(1, col);
      ctx.fillStyle=g;
      ctx.shadowColor=col; ctx.shadowBlur=10; ctx.fill();
      ctx.shadowBlur=0;
      ctx.font='22px Arial'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(p.emoji, px, py+2);
    });
  };
  drawPreviewRow(zRow, SAFE.y+260, '🍽 ZOMATO', BRAND.zomato);
  drawPreviewRow(bRow, SAFE.y+325, '🛒 BLINKIT', BRAND.blinkit);

  ctx.font='14px Arial'; ctx.fillStyle='rgba(255,255,255,.75)';
  ctx.textAlign='center';
  const lines=[
    '🙌 Catch with your hands',
    '🍕↔🛒 Alternate brands = ECOSYSTEM!',
    '⏰ Avoid late delivery',
    '🏆 Climb the tier ladder',
  ];
  lines.forEach((l,i)=>ctx.fillText(l, cx, SAFE.y+385+i*26));

  ctx.font='bold 14px Arial';
  const hg=ctx.createLinearGradient(cx-50,0,cx+50,0);
  hg.addColorStop(0,BRAND.zomato); hg.addColorStop(1,BRAND.blinkit);
  ctx.fillStyle=hg;
  ctx.fillText(BRAND.hashtag, cx, SAFE.y+SAFE.h-90);

  if(hiScore>0){
    ctx.font='bold 16px Arial'; ctx.fillStyle='#f9ca24';
    ctx.fillText(`🏆 Best: ${hiScore}`, cx, SAFE.y+SAFE.h-60);
  }
  ctx.font='13px Arial'; ctx.fillStyle='rgba(255,255,255,.45)';
  ctx.fillText('▶ Press Start Crave', cx, SAFE.y+SAFE.h-30);

  ctx.restore();
  drawHands();
}

function getTier(){
  let t=TIERS[0]; for(const tier of TIERS) if(score>=tier.min) t=tier; return t;
}

function drawEnd(title){
  ctx.fillStyle='rgba(0,0,10,.88)'; ctx.fillRect(0,0,W,H);

  /* light rays in background for premium feel */
  for(const r of lightRays) r.draw();

  const cardW=SAFE.w-15, cardH=SAFE.h-30;
  const cardX=SAFE.x+7.5, cardY=SAFE.y+15;
  const cx=cardX+cardW/2;

  /* receipt-style card with subtle paper texture */
  card(cardX, cardY, cardW, cardH, .72);

  ctx.save(); ctx.textAlign='center'; ctx.textBaseline='middle';

  /* tier badge — big emoji with glow */
  const tier=getTier();
  let y = cardY + 50;
  ctx.shadowColor=tier.color; ctx.shadowBlur=30;
  ctx.font='84px Arial';
  ctx.fillText(tier.emoji, cx, y); y+=66;
  ctx.shadowBlur=0;

  ctx.font='900 26px -apple-system,Arial';
  ctx.fillStyle=tier.color;
  ctx.fillText(tier.label, cx, y); y+=38;

  /* title */
  ctx.font='bold 14px Arial'; ctx.fillStyle='rgba(255,255,255,.5)';
  ctx.fillText(title, cx, y); y+=28;

  /* score */
  ctx.font='900 32px Arial'; ctx.fillStyle='#fff';
  ctx.shadowColor='rgba(0,0,0,.6)'; ctx.shadowBlur=4;
  ctx.fillText(`${score} pts · LV ${level}`, cx, y); y+=42;
  ctx.shadowBlur=0;

  /* divider with brand gradient */
  const dg=ctx.createLinearGradient(cardX+30,y,cardX+cardW-30,y);
  dg.addColorStop(0,BRAND.zomato+'00');
  dg.addColorStop(.5, BRAND.accent);
  dg.addColorStop(1, BRAND.blinkit+'00');
  ctx.beginPath(); ctx.moveTo(cardX+30,y); ctx.lineTo(cardX+cardW-30,y);
  ctx.strokeStyle=dg; ctx.lineWidth=1.5; ctx.stroke();
  y+=18;

  /* haul label */
  ctx.font='bold 12px Arial';
  ctx.fillStyle=BRAND.accent;
  ctx.fillText('🛍️ YOUR HAUL', cx, y);
  y+=24;

  /* TWO-COLUMN haul */
  const zHaul=Object.entries(cart.zomato).sort((a,b)=>b[1]-a[1]).slice(0,4);
  const bHaul=Object.entries(cart.blinkit).sort((a,b)=>b[1]-a[1]).slice(0,4);

  /* Zomato column */
  const colX1 = cardX + 30;
  const colX2 = cardX + cardW/2 + 10;
  ctx.font='bold 10px Arial'; ctx.textAlign='left';
  ctx.fillStyle=BRAND.zomato;
  ctx.fillText('🍽 ZOMATO', colX1, y);
  ctx.fillStyle=BRAND.blinkit;
  ctx.fillText('🛒 BLINKIT', colX2, y);
  y+=18;

  ctx.font='12px Arial'; ctx.fillStyle='rgba(255,255,255,.85)';
  const maxRows = Math.max(zHaul.length, bHaul.length, 1);
  for(let i=0; i<maxRows; i++){
    if(zHaul[i]){
      const prod=BRAND.products.find(p=>p.name===zHaul[i][0]);
      if(prod){
        ctx.fillText(`${prod.emoji} ${prod.name} ×${zHaul[i][1]}`, colX1, y+i*18);
      }
    }
    if(bHaul[i]){
      const prod=BRAND.products.find(p=>p.name===bHaul[i][0]);
      if(prod){
        ctx.fillText(`${prod.emoji} ${prod.name} ×${bHaul[i][1]}`, colX2, y+i*18);
      }
    }
  }
  y += maxRows*18 + 8;

  /* totals */
  const totalZ = Object.values(cart.zomato).reduce((a,b)=>a+b,0);
  const totalB = Object.values(cart.blinkit).reduce((a,b)=>a+b,0);
  ctx.font='11px Arial'; ctx.textAlign='center';
  ctx.fillStyle='rgba(255,255,255,.55)';
  ctx.fillText(`${totalZ} food · ${totalB} grocery · delivered in 10 min`, cx, y);
  y+=22;

  /* bottom divider */
  ctx.beginPath(); ctx.moveTo(cardX+30,y); ctx.lineTo(cardX+cardW-30,y);
  ctx.strokeStyle=dg; ctx.lineWidth=1.5; ctx.stroke();
  y+=18;

  /* CTA — the marketing payload */
  ctx.font='bold 14px Arial'; ctx.fillStyle='#fff';
  ctx.fillText(`🎁 ${tier.reward}`, cx, y); y+=22;

  ctx.font='bold 12px Arial';
  ctx.fillStyle='rgba(255,255,255,.6)';
  ctx.fillText(`Tag ${BRAND.handles}`, cx, y); y+=18;
  const fg=ctx.createLinearGradient(cx-50,0,cx+50,0);
  fg.addColorStop(0,BRAND.zomato); fg.addColorStop(1,BRAND.blinkit);
  ctx.font='bold 14px Arial'; ctx.fillStyle=fg;
  ctx.fillText(BRAND.hashtag, cx, y);

  ctx.font='10px Arial'; ctx.fillStyle='rgba(255,255,255,.35)';
  ctx.fillText('▶ Press Start to play again', cx, cardY+cardH-18);

  ctx.restore();
}

/* ════════════════════════════════════════
   GAME LOOP
   ════════════════════════════════════════ */
function gameLoop(ts){
  const dt=Math.min((ts-lastTime)/1000,.05); lastTime=ts;
  pulseT += dt;

  ctx.setTransform(SCALE,0,0,SCALE,0,0);
  if(shakeFrames>0){
    const a=shakeAmp*(shakeFrames/20);
    ctx.translate((Math.random()-.5)*a, (Math.random()-.5)*a);
    shakeFrames--;
  }

  drawBackground(dt);

  /* light rays only during level-up, fade fast */
  for(const r of lightRays){ r.update(); r.draw(); }
  lightRays=lightRays.filter(r=>r.life>0);

  /* level-up flash */
  if(flashAlpha>0){
    ctx.fillStyle=`rgba(255,215,0,${flashAlpha})`;
    ctx.fillRect(0,0,W,H);
    flashAlpha=Math.max(0,flashAlpha-dt*2.5);
  }

  drawSafeZone();

  if(gameState==='countdown'){
    cdT-=dt;
    if(cdT<=0){
      cdNum--;
      if(cdNum<0){
        gameState='playing'; timerLeft=parseInt(timerMode)||999; timerRunning=true;
        /* gentle starter — 2 items */
        for(let i=0;i<2;i++){
          const it=new Item({type:'product', spec:pickWeighted()});
          it.y = -20 - i*100;
          it.x = SAFE.x + 80 + i*((SAFE.w-160)) + (Math.random()-.5)*30;
          items.push(it);
        }
        spawnTimer=.6;
      }
      else { cdT=1; playCount(cdNum===0); }
    }
    if(Math.random()<.04 && items.length<4){
      items.push(new Item({type:'product', spec:pickWeighted()}));
    }
    for(const it of items){it.update(dt); it.draw();}
    items=items.filter(i=>i.alive);
    drawHands(); drawCountdown();

  } else if(gameState==='playing'){
    if(timerMode!=='endless'&&timerRunning){
      timerLeft=Math.max(0,timerLeft-dt);
      if(timerLeft<=0){timerRunning=false;endGame();}
    }
    if(doubleActive){doubleTimer-=dt;if(doubleTimer<=0)doubleActive=false;}
    if(freezeActive){freezeTimer-=dt;if(freezeTimer<=0)freezeActive=false;}

    spawnTimer-=dt;
    if(spawnTimer<=0){
      const cfg=lvlCfg(level);
      spawnTimer=cfg.spawnSec*(.85+Math.random()*.3);
      if(items.length<6) items.push(new Item());
    }
    if(comboFrames>0) comboFrames--; else if(combo>0) combo=0;
    if(stampT>0) stampT-=dt*0.8;

    for(const it of items){it.update(dt); it.draw();}
    for(const it of items) if(!it.caught && it.hit(handPts)) catchItem(it);
    items=items.filter(i=>i.alive);

    for(const f of cartFlyers){f.update(dt); f.draw();}
    cartFlyers=cartFlyers.filter(f=>!f.done());

    for(const p of particles){p.update(); p.draw();}
    particles=particles.filter(p=>p.life>0);
    for(const c of confetti){c.update(); c.draw();}
    confetti=confetti.filter(c=>c.life>0);
    for(const t of floatTexts){t.update(); t.draw();}
    floatTexts=floatTexts.filter(t=>t.life>0);

    drawHands(); drawHUD();

  } else if(gameState==='ready'){
    drawReady();
  } else if(gameState==='stopped'||gameState==='gameover'){
    for(const p of particles){p.update();p.draw();} particles=particles.filter(p=>p.life>0);
    for(const c of confetti){c.update();c.draw();}  confetti=confetti.filter(c=>c.life>0);
    drawEnd(gameState==='stopped'?'CRAVE PAUSED':'YOUR DROP RECEIPT');
  }

  requestAnimationFrame(gameLoop);
}

/* ════════════════════════════════════════
   RECORDING
   ════════════════════════════════════════ */
let isRecording=false, mediaRecorder=null, recChunks=[], savedBlob=null, savedMime='';
function pickMime(){
  const want=['video/mp4;codecs=avc1.42E01F','video/mp4;codecs=avc1','video/mp4',
              'video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'];
  for(const m of want) if(MediaRecorder.isTypeSupported(m)) return m;
  return '';
}
function startRecording(){
  recChunks=[]; savedBlob=null; dlArea.style.display='none'; getAC();
  const videoStream=canvas.captureStream(30);
  let stream=videoStream;
  if(audioDest && audioDest.stream && audioDest.stream.getAudioTracks().length){
    stream=new MediaStream([...videoStream.getVideoTracks(), ...audioDest.stream.getAudioTracks()]);
  }
  savedMime=pickMime();
  const opts={videoBitsPerSecond:6_000_000, audioBitsPerSecond:128_000};
  if(savedMime) opts.mimeType=savedMime;
  try{ mediaRecorder=new MediaRecorder(stream,opts); }
  catch(e){ mediaRecorder=new MediaRecorder(stream); savedMime='video/webm'; }
  mediaRecorder.ondataavailable=e=>{if(e.data.size>0)recChunks.push(e.data);};
  mediaRecorder.onstop=onRecDone;
  mediaRecorder.start(100);
  isRecording=true;
  recordBtn.textContent='⏹ Stop & Save'; recordBtn.classList.add('rec');
  statusEl.textContent='● REC '+(savedMime.includes('mp4')?'(MP4)':'(WebM)')+' + audio';
  try{
    const ac=getAC(); if(ac){
      const o=ac.createOscillator(), g=ac.createGain();
      g.gain.value=0.0001; o.connect(g); g.connect(audioOut());
      o.frequency.value=20; o.start();
      mediaRecorder._silentOsc=o;
    }
  }catch(_){}
}
function stopRecording(){
  if(mediaRecorder){
    try{ if(mediaRecorder._silentOsc) mediaRecorder._silentOsc.stop(); }catch(_){}
    if(mediaRecorder.state!=='inactive') mediaRecorder.stop();
  }
  isRecording=false;
  recordBtn.textContent='⏺ Record'; recordBtn.classList.remove('rec');
  statusEl.textContent='Saving…';
}
function onRecDone(){
  const ext=savedMime.includes('mp4')?'mp4':'webm';
  savedBlob=new Blob(recChunks,{type:savedMime||'video/webm'});
  savedBlob.__ext=ext;
  const mb=(savedBlob.size/1024/1024).toFixed(1);
  dlMeta.textContent=`${mb} MB · 1080×1920 · .${ext}\nReady for Reels / Shorts`;
  dlArea.style.display='flex';
  statusEl.textContent='✅ Done! Hit ⬇ Download';
}
dlBtn.addEventListener('click',()=>{
  if(!savedBlob) return;
  ping('downloads');
  const url=URL.createObjectURL(savedBlob);
  const a=document.createElement('a');
  a.href=url; a.download=`crave-${Date.now()}.${savedBlob.__ext||'webm'}`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  dlMeta.textContent=`Downloaded! 🚀 Tag ${BRAND.handles}`;
});

/* ════════════════════════════════════════
   BUTTONS
   ════════════════════════════════════════ */
function resetGame(){
  score=0; level=1; lives=3; combo=0; comboFrames=0; levelScore=0;
  items=[]; particles=[]; floatTexts=[]; confetti=[]; cartFlyers=[]; lightRays=[];
  cart={zomato:{}, blinkit:{}};
  lastBrand=null; crossStreak=0; totalCatches=0; stampT=0;
  spawnTimer=1; flashAlpha=0; shakeFrames=0;
  doubleActive=false; doubleTimer=0; freezeActive=false; freezeTimer=0;
  timerRunning=false; timerLeft=parseInt(timerMode)||999;
}
startBtn.addEventListener('click',()=>{
  getAC();
  resetGame();
  ping('starts');
  gameState='countdown'; cdNum=3; cdT=1; playCount(false);
  startBtn.textContent='🔄 Restart';
  statusEl.textContent=cameraOK?'Get ready…':'⚠️ No camera (demo)';
});
stopBtn.addEventListener('click',()=>{
  if(gameState==='playing'||gameState==='countdown') stopGame();
});
recordBtn.addEventListener('click',()=>{ if(!isRecording) startRecording(); else stopRecording(); });
muteBtn.addEventListener('click',()=>{
  muted=!muted;
  muteBtn.textContent=muted?'🔇 Sound OFF':'🔊 Sound ON';
  muteBtn.classList.toggle('on',!muted);
});
safeBtn.addEventListener('click',()=>{
  safeZoneVisible=!safeZoneVisible;
  safeBtn.textContent=safeZoneVisible?'📐 Safe Zone ON':'📐 Safe Zone';
  safeBtn.classList.toggle('on',safeZoneVisible);
});
document.querySelectorAll('.t-btn').forEach(el=>el.addEventListener('click',()=>{
  document.querySelectorAll('.t-btn').forEach(b=>b.classList.remove('active'));
  el.classList.add('active'); timerMode=el.dataset.mode;
}));

/* ════════════════════════════════════════
   INIT
   ════════════════════════════════════════ */
setupCamera();
requestAnimationFrame(t=>{lastTime=t;gameLoop(t);});
</script>
